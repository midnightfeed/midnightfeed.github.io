name: Fetch covers

# Run by hand from the Actions tab. Downloads Archive cover images from Open Library
# and commits them. New covers stay hidden until they are checked and marked verified.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fetch-covers.mjs
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/covers
          if git diff --cached --quiet; then
            echo "No new covers."
          else
            git commit -m "Archive covers"
            git pull --rebase
            git push
          fi

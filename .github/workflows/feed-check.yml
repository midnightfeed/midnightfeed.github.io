name: Feed check

# Run by hand from the Actions tab. Reports which sources are reachable and
# how many items each would contribute. Changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-wire.mjs --check
